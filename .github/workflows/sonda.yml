name: sonda
on: push
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -m 20 -A "$UA" -w "\nHTTP %{http_code}\n" "https://portal.gupy.io/job-search/term=java" > p.html; tail -1 p.html; wc -c p.html
          grep -o 'https://[a-z0-9.-]*gupy[a-z0-9.-]*/[a-zA-Z0-9/_?=&.-]*' p.html | sort -u | head -30
          grep -o '"jobUrl":"[^"]*"' p.html | head -3
          grep -o '__NEXT_DATA__' p.html | head -1
          python3 - <<'PY'
          import re
          s=open('p.html').read()
          m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', s, re.S)
          if m:
              print(m.group(1)[:3000])
          for js in sorted(set(re.findall(r'src="(/_next/static/[^"]+\.js)"', s)))[:40]:
              print("JS", js)
          PY
          for js in $(grep -o 'src="/_next/static/[^"]*\.js"' p.html | cut -d'"' -f2); do curl -sS -m 20 -A "$UA" "https://portal.gupy.io$js" | grep -o '[a-z\-]*\.gupy\.io/api[a-zA-Z0-9/_-]*\|/api/v[0-9]/[a-zA-Z0-9/_-]*\|jobName' | sort -u; done | sort -u | head -40
