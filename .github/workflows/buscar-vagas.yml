name: Buscar vagas

on:
  # Quem dispara é o cron-job.org (segunda a sábado, 8h e 17h de Brasília), chamando a API do
  # GitHub com um token que só pode rodar este workflow. O agendamento do próprio GitHub atrasava
  # horas ou nem disparava.
  workflow_dispatch: # também dá para rodar na hora pelo botão "Run workflow"

permissions:
  contents: write
  issues: write

concurrency:
  group: buscar-vagas

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dia e turno
        id: hoje
        run: |
          DIA=$(TZ=America/Sao_Paulo date +%F)
          HORA=$(TZ=America/Sao_Paulo date +%-H)
          if [ "$HORA" -lt 13 ]; then TURNO=manha; else TURNO=tarde; fi
          echo "dia=$DIA" >> "$GITHUB_OUTPUT"
          echo "turno=$TURNO" >> "$GITHUB_OUTPUT"
          # linhas que o relatório do dia já tinha, para a issue mostrar só o que for novo
          echo "linhas=$(cat "relatorios/$DIA.md" 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e testar
        run: mvn -B -q package

      - name: Buscar vagas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
        run: java -jar target/buscador-vagas.jar config.json

      - name: Salvar relatório no repositório
        id: salvar
        run: |
          git config user.name "buscador-vagas"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "Histórico de vagas vistas"
          git add relatorios
          if ! git diff --cached --quiet; then
            git commit -m "Vagas de ${{ steps.hoje.outputs.dia }}"
            echo "relatorio_mudou=true" >> "$GITHUB_OUTPUT"
          fi
          git push

      - name: Abrir issue com as vagas novas
        if: steps.salvar.outputs.relatorio_mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARQUIVO="relatorios/${{ steps.hoje.outputs.dia }}.md"
          # só o trecho que esta execução acrescentou
          tail -n +$(( ${{ steps.hoje.outputs.linhas }} + 1 )) "$ARQUIVO" > novas.md
          if grep -q "Nenhuma vaga nova" novas.md; then exit 0; fi
          if [ "${{ steps.hoje.outputs.turno }}" = "manha" ]; then HORA=8h; else HORA=17h; fi
          # O GitHub aceita até 65 mil caracteres no corpo da issue
          { head -c 60000 novas.md; echo; echo; echo "Relatório completo: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/$ARQUIVO"; } > corpo.md
          gh issue create --title "Vagas de ${{ steps.hoje.outputs.dia }} ($HORA)" --body-file corpo.md
