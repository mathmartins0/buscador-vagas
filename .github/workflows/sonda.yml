name: sonda
on: push
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sondar
        run: |
          rm -rf sonda; mkdir -p sonda; cd sonda
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          baixar() { curl -sS -L -m 25 -A "$UA" -H "Accept-Language: pt-BR,pt;q=0.9" -o "$1" -w "$1 HTTP %{http_code} %{size_download}B %{url_effective}\n" "$2" >> status.txt 2>>status.txt || echo "$1 ERRO" >> status.txt; }
          baixar vagascom_detalhe.html "https://www.vagas.com.br/vagas/v2839391/11385-desenvolvedor-java"
          baixar vagascom_home.html "https://www.vagas.com.br/vagas-de-java?m%5B%5D=100%25+Home+Office"
          baixar infojobs_pj_home.html "https://www.infojobs.com.br/vagas-de-emprego-java-trabalho-home-office.aspx?tipocontrato=17"
          baixar infojobs_detalhe.html "https://www.infojobs.com.br/vaga-de-desenvolvedor-software-geo-em-parana__12135182.aspx"
          baixar remotar_p2.json "https://api.remotar.com.br/jobs?search=java&page=2"
          baixar backendbr_java.json "https://api.github.com/repos/backend-br/vagas/issues?state=open&per_page=100&labels=Java"
      - run: |
          git config user.name sonda; git config user.email sonda@users.noreply.github.com
          git add -f sonda; git commit -qm "resultado sonda 2"; git push
